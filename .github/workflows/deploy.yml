name: Deploy to GitHub Pages

on:
  # التشغيل عند الدفع (Push) للفرع الرئيسي (main)
  push:
    branches: [main]
  # السماح بالتشغيل اليدوي من تبويب Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Install, build, and upload your site
        uses: withastro/action@v3
        # ملاحظة: سيقوم هذا الـ Action تلقائياً باكتشاف مدير الحزم (npm أو pnpm) وبناء الموقع

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
